name: Update Alist & Alist-Web

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    tags:
      - "run-update"

jobs:
  update:
    runs-on: docker

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Install tools
        run: |
          apk add --no-cache curl jq sed coreutils

      - name: Fetch latest Alist version
        id: alist
        run: |
          VERSION=$(curl -s https://api.github.com/repos/AlistGo/alist/releases/latest | jq -r '.tag_name' | sed 's/^v//')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

          curl -L -o alist.tar.gz https://codeload.github.com/AlistGo/alist/tar.gz/v${VERSION}
          HASH=$(sha256sum alist.tar.gz | awk '{print $1}')
          echo "hash=$HASH" >> $GITHUB_OUTPUT

      - name: Fetch latest Alist-Web version
        id: alist_web
        run: |
          WEB_VERSION=$(curl -s https://api.github.com/repos/AlistGo/alist-web/releases/latest | jq -r '.tag_name')
          echo "web_version=$WEB_VERSION" >> $GITHUB_OUTPUT

          curl -L -o alist-web.tar.gz https://github.com/AlistGo/alist-web/releases/download/${WEB_VERSION}/dist.tar.gz
          WEB_HASH=$(sha256sum alist-web.tar.gz | awk '{print $1}')
          echo "web_hash=$WEB_HASH" >> $GITHUB_OUTPUT

      - name: Update Makefile
        run: |
          MF=./Makefile

          sed -i "s/^PKG_VERSION:=.*/PKG_VERSION:=${{ steps.alist.outputs.version }}/" $MF
          sed -i "s/^PKG_WEB_VERSION:=.*/PKG_WEB_VERSION:=${{ steps.alist_web.outputs.web_version }}/" $MF
          sed -i "s/^PKG_HASH:=.*/PKG_HASH:=${{ steps.alist.outputs.hash }}/" $MF

          sed -i "s/^  HASH:=.*/  HASH:=${{ steps.alist_web.outputs.web_hash }}/" $MF

      - name: Commit & Push
        run: |
          git config --global user.email "bot@gitea"
          git config --global user.name "Gitea Bot"

          git add Makefile
          git commit -m "Update Alist to ${{ steps.alist.outputs.version }} & Alist-Web to ${{ steps.alist_web.outputs.web_version }}"
          git push
